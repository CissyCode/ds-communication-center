# 조간 지면 스크랩 규칙 — 상시 기준 (일반 예시 템플릿)
# 실제 팀 설정은 저장소에 올리지 않고 사내 PC의 config.yaml에만 둡니다.
# 현안은 issues.yaml(만료일 필수), 그날만 쓰는 지시는 today.yaml 로 따로 둡니다.

papers:
  weekday:
    - {name: 전자신문, ready: "05:00"}
    - {name: 매일경제, ready: "06:00"}
    - {name: 한국경제, ready: "06:00"}
    - {name: 서울경제, ready: "06:00"}
    - {name: 경향신문, ready: "06:30"}
    - {name: 세계일보, ready: "07:00"}
    - {name: 동아일보}
  weekend:
    - {name: 매일경제, ready: "06:00"}
    - {name: 동아일보}
restrict_media: false
media_priority: [매일경제, 한국경제, 서울경제, 전자신문, 헤럴드경제, 경향신문, 문화일보]
sections:
  - name: 핵심
    weight: 100
    keywords: [우리회사 반도체, 우리회사 HBM, 반도체, 경쟁사A, HBM, 메모리]
    subtopics:
      - {name: 보도자료, keywords: []}
      - {name: 현안, keywords: []}
      - {name: 지역, keywords: [평택]}
      - {name: 반도체 업계, keywords: [경쟁사A, HBM, 메모리]}
      - {name: 기타, keywords: []}
  - name: 관계사
    weight: 70
    keywords: [우리회사, 계열사A]
    subtopics:
      - {name: 전사, keywords: [노조]}
      - {name: 금융, keywords: [계열사A]}
      - {name: 기타, keywords: []}
  - name: 기타
    weight: 45
    keywords: [정부, 경제]
    subtopics:
      - {name: 정부, keywords: [정부]}
      - {name: 경제, keywords: [경제]}
      - {name: 사회/국제, keywords: []}
  - name: 칼럼/사설
    weight: 60
    opinion: true
    preferred_media: [매일경제, 한국경제, 서울경제]
    other_media_factor: 0.8
default_section: 기타
default_weight: 20
exclude_page_prefixes: [B, C]
exclude_keywords: [부고, 전면광고, 지면광고]
# 카테고리가 이것이면 제외 후보(예: '삼성' 검색어에 걸린 야구 기사, 광고)
exclude_categories: [광고, 스포츠]
scoring: {min_score: 40, front_page_bonus: 30, early_page_bonus: 10, early_page_until: 5, size_bonus_per_100cm2: 2}
